name: Netbox → Network Diagram

on:
  # Run every Monday 18:00 UTC
  schedule:
    - cron: '0 18 * * 1'

  # Trigger on push when the diagram script changes
  push:
    paths:
      - 'scripts/generate_diagram.py'

  # Manual trigger from Actions UI
  workflow_dispatch:
    inputs:
      cluster_diagrams:
        description: 'Generate cluster detail diagrams'
        type: boolean
        default: false
      cluster:
        description: 'Single cluster name (leave empty for all)'
        type: string
        default: ''
      no_vms:
        description: 'Hide VMs/containers in main diagram'
        type: boolean
        default: false
      cluster_context_levels:
        description: 'Parent switch levels in cluster diagrams (default: 1)'
        type: string
        default: '1'

permissions:
  contents: write           # Required to commit diagram back to repo

jobs:
  generate-diagram:
    name: Generate network diagram from Netbox
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ── 2. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev 2>/dev/null || true
          pip install cairosvg || echo "cairosvg install failed – PNG export skipped"

      # ── 4. Create assets directory ────────────────────────────────────────────
      - name: Ensure assets directory exists
        run: mkdir -p assets

      # ── 5. Generate diagram ───────────────────────────────────────────────────
      - name: Generate SVG/PNG from Netbox API
        env:
          NETBOX_URL:   ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
        run: |
          ARGS=""
          # Scheduled and push runs: keep default simplify (cluster boxes)
          # Manual run: respect inputs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.cluster_diagrams }}" = "true" ]; then
              ARGS="$ARGS --cluster-diagrams"
            fi
            if [ -n "${{ github.event.inputs.cluster }}" ]; then
              ARGS="$ARGS --cluster ${{ github.event.inputs.cluster }}"
            fi
            if [ "${{ github.event.inputs.no_vms }}" = "true" ]; then
              ARGS="$ARGS --no-vms"
            fi
            if [ -n "${{ github.event.inputs.cluster_context_levels }}" ] && \
               [ "${{ github.event.inputs.cluster_context_levels }}" != "1" ]; then
              ARGS="$ARGS --cluster-context-levels ${{ github.event.inputs.cluster_context_levels }}"
            fi
          else
            # Scheduled and push runs: generate cluster diagrams, hide VMs in main diagram
            ARGS="$ARGS --cluster-diagrams --no-vms"
          fi
          python scripts/generate_diagram.py $ARGS

      # ── 6. Check for changes ──────────────────────────────────────────────────
      - name: Check for diagram changes
        id: diff
        run: |
          git add assets/
          git diff --cached --quiet \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      # ── 7. Commit & push ──────────────────────────────────────────────────────
      - name: Commit and push updated diagram
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update network diagram [skip ci]

          Auto-generated by Netbox API · $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # ── 8. No-op notice ───────────────────────────────────────────────────────
      - name: No changes detected
        if: steps.diff.outputs.changed == 'false'
        run: echo "Diagram unchanged – nothing to commit."
