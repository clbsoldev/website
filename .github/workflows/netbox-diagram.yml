name: Netbox → Network Diagram

on:
  # Run every Monday at 18:00 UTC
  schedule:
    - cron: '0 18 * * 1'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the generated diagram back

jobs:
  generate-diagram:
    name: Generate network diagram from Netbox
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # cairosvg for optional PNG export (requires system libs)
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev 2>/dev/null || true
          pip install cairosvg || echo "cairosvg install failed – PNG export skipped"

      # ── 4. Create assets directory (if not present) ───────────────────────────
      - name: Ensure assets directory exists
        run: mkdir -p assets

      # ── 5. Generate diagram ───────────────────────────────────────────────────
      - name: Generate SVG/PNG from Netbox API
        env:
          NETBOX_URL:   ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
        run: python scripts/generate_diagram.py

      # ── 6. Check for changes ──────────────────────────────────────────────────
      - name: Check for diagram changes
        id: diff
        run: |
          git diff --quiet assets/ && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      # ── 7. Commit & push (only if something changed) ──────────────────────────
      - name: Commit and push updated diagram
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/diagram.svg assets/diagram.png assets/diagram_meta.json || true
          git commit -m "chore: update network diagram [skip ci]

          Auto-generated by Netbox API · $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # ── 8. No-op notice ───────────────────────────────────────────────────────
      - name: No changes detected
        if: steps.diff.outputs.changed == 'false'
        run: echo "Diagram unchanged since last run – nothing to commit."
